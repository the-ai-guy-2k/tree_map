name: ci

on:
  push:
  pull_request:
    branches:
      - main
      - deployable

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start server, wait for health, run the API suite
        run: |
          set -u
          TREE_DB="$RUNNER_TEMP/smoke.db" PORT=3000 node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              echo "health ok"
              TEST_SCOPE=api npm test
              exit $?
            fi
            sleep 0.5
          done
          echo "health check failed"
          cat "$RUNNER_TEMP/server.log"
          exit 1

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start server and run the UI suite
        run: |
          set -u
          PORT=3000 node server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              echo "health ok"
              BASE_URL=http://127.0.0.1:3000 TEST_SCOPE=ui npm test
              exit $?
            fi
            sleep 0.5
          done
          echo "health check failed"
          cat "$RUNNER_TEMP/server.log"
          exit 1

  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static deploy checks
        run: node tests/structure.js
