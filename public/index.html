<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>TAIG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">TAIG</div>
  <nav class="tabs" aria-label="Focus">
    <button type="button" class="tab is-on" data-focus="all" aria-pressed="true">Overview</button>
    <button type="button" class="tab" data-focus="its" aria-pressed="false">TAIG ITS</button>
    <button type="button" class="tab" data-focus="promo" aria-pressed="false">TAIG Promo</button>
    <button type="button" class="tab" data-focus="tan" aria-pressed="false">TAIG TAN</button>
    <button type="button" class="tab" data-focus="cott" aria-pressed="false">COTT</button>
  </nav>
  <label class="search">
    <span>Search</span>
    <input id="search" type="search" aria-label="Search" autocomplete="off" spellcheck="false">
  </label>
</header>
<div class="controls" aria-label="Map controls">
  <button type="button" id="zoomOut" class="icon" aria-label="Zoom out">−</button>
  <button type="button" id="zoomIn" class="icon" aria-label="Zoom in">+</button>
  <button type="button" id="fit">Fit map</button>
  <button type="button" id="expand">Expand all</button>
  <button type="button" id="fold">Fold branches</button>
  <button type="button" id="sync">Sync</button>
</div>
<main class="stage">
  <svg id="map" aria-label="TAIG tree map"></svg>
  <aside id="panel" class="panel" aria-label="Bubble" aria-hidden="true" inert>
    <button type="button" class="icon" id="close" aria-label="Close">×</button>
    <p id="crumb" class="crumb"></p>
    <input id="label" class="label-input" type="text" aria-label="Label" autocomplete="off" spellcheck="false">
    <input id="sub" class="sub-input" type="text" aria-label="Sub-line" autocomplete="off" spellcheck="false">
    <div class="field">
      <span class="field-label">Status</span>
      <div class="status" id="status"></div>
    </div>
    <label class="field">
      <span class="field-label">Branch</span>
      <span class="branch-line">
        <i id="branchDot"></i>
        <select id="branch" aria-label="Branch"></select>
      </span>
    </label>
    <div class="field">
      <span class="field-label">Note</span>
      <textarea id="note" aria-label="Note" rows="4"></textarea>
      <div class="row">
        <button type="button" id="saveNote">Save</button>
        <button type="button" id="clearNote">Clear</button>
      </div>
    </div>
    <p id="touched" class="touched"></p>
    <div class="row" id="deleteRow">
      <button type="button" id="addChild">Add child</button>
      <button type="button" id="delete" class="danger">Delete</button>
    </div>
    <div id="addRow" class="row" hidden>
      <input id="childLabel" type="text" aria-label="Child label" autocomplete="off" spellcheck="false">
      <button type="button" id="addConfirm">Add</button>
    </div>
    <div id="confirm" class="confirm" hidden>
      <p id="confirmText"></p>
      <div class="row">
        <button type="button" id="confirmDelete" class="danger">Delete</button>
        <button type="button" id="confirmCancel">Cancel</button>
      </div>
    </div>
  </aside>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
